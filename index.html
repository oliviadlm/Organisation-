<title>Ma Journée</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Playfair+Display:wght@600&family=Cormorant+Garamond:ital,wght@0,600;1,500&family=DM+Serif+Display&family=Libre+Baskerville:wght@700&family=Lora:ital,wght@1,500&family=Caveat:wght@600&family=Dancing+Script:wght@600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F6F1EA;--card:#FFFDF9;--ink:#2E2724;--muted:#8A8078;--line:#E9E0D4;--soft:#EFE8DE;
  --acc:#C9683F;--acc2:#6F9E8F;--acc-soft:#F4E1D6;
  --pink:#F4E1D6;--lav:#E5E7F1;--sky:#DCEAEA;--mint:#E0EDE6;--butter:#F5EBD0;--peach:#F6E0D0;
  --sage:#6CBF67;--red:#E5536A;--gold:#E8A93B;--teal:#2FA59A;--gem:#6C8CF5;
  --r:26px;--shadow:0 10px 30px rgba(90,65,45,.08);--shadow2:0 4px 14px rgba(90,65,45,.07);
  --f:'Plus Jakarta Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  --serif:'Fraunces',Georgia,serif;
}
@media (prefers-color-scheme:dark){:root{--bg:#16121A;--card:#211B26;--ink:#F5EEF6;--muted:#A396AA;--line:#33293A;--soft:#2A2230;--pink:#3A2330;--lav:#2B2640;--sky:#1F2A3D;--mint:#1E3127;--butter:#3A321C;--peach:#3B2A22;--acc-soft:#3A2330;--shadow:0 10px 30px rgba(0,0,0,.35);--shadow2:0 4px 14px rgba(0,0,0,.3)}}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg);color:var(--ink);font-family:var(--f);font-size:16px}
body{padding-bottom:calc(108px + env(safe-area-inset-bottom));min-height:100vh;overscroll-behavior-y:none}
body::before{content:'';position:fixed;inset:-20% -20% auto -20%;height:70vh;z-index:-1;background:radial-gradient(40% 40% at 15% 20%,color-mix(in srgb,var(--acc) 16%,transparent),transparent 70%),radial-gradient(40% 40% at 85% 10%,color-mix(in srgb,var(--acc2) 18%,transparent),transparent 70%);pointer-events:none}
button{font-family:inherit;font-size:inherit;color:inherit;border:0;background:none;cursor:pointer}
svg.i{display:inline-block;vertical-align:middle;flex:none}
input,textarea,select{font-family:inherit;font-size:16px;color:var(--ink);background:var(--soft);border:1.5px solid transparent;border-radius:16px;padding:12px 14px;width:100%;outline:none}
input:focus,textarea:focus,select:focus{border-color:var(--acc)}
textarea{min-height:90px;resize:vertical;line-height:1.5}
/* barre du haut */
.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);padding:calc(10px + env(safe-area-inset-top)) 18px 10px;display:flex;align-items:center;gap:8px;min-height:58px}
.top h1{font-weight:800;font-size:22px;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:-.3px}
.back{width:40px;height:40px;border-radius:50%;background:var(--card);display:grid;place-items:center;box-shadow:var(--shadow2);color:var(--acc);flex:none}
.chip{display:inline-flex;align-items:center;gap:5px;background:var(--card);border-radius:999px;padding:7px 11px;font-weight:800;font-size:13px;box-shadow:var(--shadow2);white-space:nowrap}
.iconbtn{width:40px;height:40px;border-radius:50%;background:var(--card);color:var(--acc);display:grid;place-items:center;box-shadow:var(--shadow2);flex:none}
main{padding:2px 18px 20px;max-width:640px;margin:0 auto}
/* barre d'onglets flottante */
.tabs{position:fixed;left:12px;right:12px;bottom:calc(10px + env(safe-area-inset-bottom));z-index:30;background:color-mix(in srgb,var(--card) 88%,transparent);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-radius:28px;box-shadow:0 12px 34px rgba(90,65,45,.16);display:flex;align-items:center;padding:8px 6px;max-width:560px;margin:0 auto}
.tabs button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:4px 0;font-size:11px;font-weight:700;color:var(--muted)}
.tabs button.on{color:var(--acc)}
.tabs .fab{flex:0 0 auto;width:58px;height:58px;border-radius:50%;background:linear-gradient(135deg,var(--acc),var(--acc2));color:#fff;display:grid;place-items:center;margin:-26px 6px 0;box-shadow:0 10px 24px color-mix(in srgb,var(--acc) 45%,transparent)}
/* textes */
.hello{margin:8px 2px 16px}
.hello h2{font-size:28px;font-weight:800;letter-spacing:-.6px;line-height:1.15}
.hello h2 span{color:var(--acc)}
.hello p{color:var(--muted);font-weight:600;margin-top:4px}
.h2{font-weight:800;font-size:18px;letter-spacing:-.2px;margin:24px 2px 12px;display:flex;align-items:center;gap:8px}
.h2 .i{color:var(--acc)}
.h2 small{font-size:13px;color:var(--acc);font-weight:700;margin-left:auto}
.muted{color:var(--muted)}.small{font-size:13px}.b{font-weight:800}
.row{display:flex;align-items:center;gap:10px}.wrap{flex-wrap:wrap}.grow{flex:1;min-width:0}
.card{background:var(--card);border-radius:var(--r);padding:16px;box-shadow:var(--shadow);margin-bottom:14px}
.btn{background:var(--acc);color:#fff;font-weight:700;border-radius:999px;padding:13px 18px;display:inline-flex;align-items:center;justify-content:center;gap:7px}
.btn.alt{background:var(--soft);color:var(--ink)}.btn.white{background:#fff;color:var(--acc)}.btn.dark{background:var(--ink);color:var(--bg)}.btn.full{width:100%}.btn.sm{padding:8px 13px;font-size:14px}
.btn.gem{background:var(--gem)}.btn.gold{background:linear-gradient(135deg,#F7CF64,#E8A93B);color:#4A3000}
.btn:active,.iconbtn:active,.tap:active,.ccard:active{transform:scale(.97)}
.btn[disabled]{opacity:.45}
.seg{display:flex;background:var(--soft);border-radius:999px;padding:4px;margin:4px 0 14px}
.seg button{flex:1;padding:10px 4px;border-radius:999px;font-weight:700;font-size:14px;color:var(--muted);display:flex;align-items:center;justify-content:center;gap:6px}
.seg button.on{background:var(--card);color:var(--acc);box-shadow:var(--shadow2)}
.seg.pink button.on{background:var(--acc);color:#fff}
/* carrousels */
.car{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;margin:0 -18px;padding:4px 18px 10px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.car::-webkit-scrollbar{display:none}
.car>*{scroll-snap-align:start;flex:none}
.dots{display:flex;gap:5px;justify-content:center;margin:2px 0 6px}.dots i{width:6px;height:6px;border-radius:9px;background:var(--line);transition:.25s}.dots i.on{width:18px;background:var(--acc)}
.qcard{width:calc(100vw - 54px);max-width:540px;border-radius:var(--r);padding:20px;min-height:170px;position:relative;overflow:hidden;display:flex;flex-direction:column;justify-content:space-between}
.qcard .lab{display:inline-flex;align-self:flex-start;align-items:center;gap:6px;font-size:12px;font-weight:800;padding:6px 11px;border-radius:999px;background:rgba(255,255,255,.65);color:var(--ink)}
.qcard blockquote{font-family:var(--serif);font-weight:600;font-size:22px;line-height:1.3;margin:14px 0 8px;letter-spacing:-.2px}
.qcard cite{font-style:normal;font-size:13px;font-weight:700;opacity:.75}
.qcard .art{position:absolute;right:-10px;bottom:-10px;opacity:.22}
.space{width:142px;height:150px;border-radius:24px;padding:14px;display:flex;flex-direction:column;justify-content:space-between;text-align:left;color:#2A2230;position:relative;overflow:hidden}
.space .si{width:42px;height:42px;border-radius:14px;background:rgba(255,255,255,.7);display:grid;place-items:center}
.space b{font-size:16px;display:block}.space span{font-size:12px;font-weight:700;opacity:.7}
.space .go{position:absolute;right:12px;top:14px;width:30px;height:30px;border-radius:50%;background:rgba(255,255,255,.7);display:grid;place-items:center}
/* héros */
.hero{border-radius:28px;padding:18px;color:#fff;background:linear-gradient(135deg,var(--acc),var(--acc2));box-shadow:0 14px 34px color-mix(in srgb,var(--acc) 30%,transparent);margin-bottom:14px;position:relative;overflow:hidden}
.hero h2{font-size:22px;font-weight:800;letter-spacing:-.3px}
.hero p{opacity:.95;font-weight:600;margin-top:4px}
.hero .deco{position:absolute;right:-18px;top:-18px;opacity:.18}
.bar{height:9px;border-radius:99px;background:rgba(255,255,255,.3);overflow:hidden;margin-top:10px}
.bar i{display:block;height:100%;background:#fff;border-radius:99px;transition:width .6s}
.pbar{height:8px;border-radius:99px;background:var(--soft);overflow:hidden}.pbar i{display:block;height:100%;background:var(--acc);border-radius:99px;transition:width .6s}
.stats3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
.stats3 div{background:rgba(255,255,255,.2);border-radius:18px;padding:9px;text-align:center;font-weight:800;font-size:18px}
.stats3 small{display:block;font-size:11px;font-weight:700;opacity:.92}
.ringwrap{display:flex;align-items:center;gap:16px}
/* habitudes */
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px 6px}
@media (max-width:360px){.grid{grid-template-columns:repeat(2,1fr)}}
.hb{display:flex;flex-direction:column;align-items:center;padding:6px 2px 4px;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;touch-action:pan-y;position:relative}
.hb .rw{position:relative;width:100%;max-width:104px;aspect-ratio:1}
.hb svg.ring{width:100%;height:100%;overflow:visible}
.hb .ic{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none;transition:transform .2s}
.hb.holding .ic{transform:scale(.86)}
.hb .lbl{font-weight:800;font-size:13px;line-height:1.2;text-align:center;margin-top:7px}
.hb .sub{font-size:12px;font-weight:700;color:var(--muted);margin-top:2px;min-height:16px;display:flex;align-items:center;gap:3px;justify-content:center}
.hb .sub .i{width:13px;height:13px}
.hb .hold{stroke-dashoffset:289}
.hb.holding .hold{transition:stroke-dashoffset .65s linear;stroke-dashoffset:0}
.hb.done .ic{animation:pop .45s}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.3)}100%{transform:scale(1)}}
.badge{position:absolute;top:2px;right:8px;background:var(--red);color:#fff;border-radius:99px;width:20px;height:20px;display:grid;place-items:center}
.fchips{display:flex;gap:8px;overflow-x:auto;margin:0 -18px 12px;padding:0 18px;scrollbar-width:none}
.fchips::-webkit-scrollbar{display:none}
.fchips button{flex:none;padding:9px 14px;border-radius:999px;background:var(--card);font-weight:700;font-size:14px;box-shadow:var(--shadow2);display:inline-flex;gap:6px;align-items:center;color:var(--muted)}
.fchips button.on{background:var(--acc);color:#fff}
/* listes */
.item{display:flex;align-items:center;gap:12px;padding:12px 2px;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:0}
.ico{width:40px;height:40px;border-radius:14px;display:grid;place-items:center;flex:none;background:var(--pink);color:var(--acc)}
.ck{width:28px;height:28px;border-radius:50%;border:2.5px solid var(--line);flex:none;display:grid;place-items:center;color:#fff;transition:.15s}
.ck.on{background:var(--acc);border-color:var(--acc)}
.item.done .t{text-decoration:line-through;color:var(--muted)}
.t{font-weight:700;line-height:1.3}
.tag{font-size:11px;font-weight:800;padding:4px 9px;border-radius:99px;background:var(--soft);color:var(--muted);white-space:nowrap;display:inline-flex;align-items:center;gap:4px}
.del{color:var(--muted);padding:4px 6px;display:grid;place-items:center}
.alert{display:flex;gap:10px;align-items:center;padding:13px 15px;border-radius:20px;margin-bottom:8px;font-weight:700;font-size:14px;width:100%;text-align:left}
.alert.warn{background:#FFE6E6;color:#B4384C}.alert.info{background:var(--sky);color:#2C5FA0}.alert.ok{background:var(--mint);color:#3C7A38}.alert.lav{background:var(--lav);color:#5B47B8}
@media (prefers-color-scheme:dark){.alert.warn{background:#3A1F25;color:#F6A0AE}.alert.info{color:#9CC2F2}.alert.ok{color:#A6DDA2}.alert.lav{color:#C2B6F5}}
.quest{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line)}
.quest:last-child{border-bottom:0}
.quest .qi{width:44px;height:44px;border-radius:15px;display:grid;place-items:center;background:var(--lav);color:#7A62D8;flex:none}
.quest.ok .qi{background:var(--acc);color:#fff}
.quest.claimed{opacity:.55}
.chest{width:100%;border-radius:20px;padding:14px;display:flex;align-items:center;gap:12px;background:linear-gradient(135deg,#F7CF64,#E8A93B);color:#4A3000;font-weight:800;margin-top:10px}
.chest.lock{background:var(--soft);color:var(--muted)}
.chest .wob{animation:wob 1.2s infinite}
@keyframes wob{0%,100%{transform:rotate(0)}25%{transform:rotate(-10deg)}75%{transform:rotate(10deg)}}
/* calendrier */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.cal .dn{font-size:11px;font-weight:800;color:var(--muted);padding:4px 0}
.cal .d{aspect-ratio:1;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:700;font-size:15px;position:relative}
.cal .d.o{opacity:.3}.cal .d.td{color:var(--acc);font-weight:800}.cal .d.sel{background:var(--acc);color:#fff}
.dots2{display:flex;gap:2px;height:5px;margin-top:1px}.dots2 i{width:4px;height:4px;border-radius:50%}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.week .wd{background:var(--card);border-radius:999px;padding:10px 2px;text-align:center;box-shadow:var(--shadow2);min-height:82px;display:flex;flex-direction:column;align-items:center;gap:2px}
.week .wd.td{background:var(--acc);color:#fff}
/* feuilles */
.sheet{position:fixed;inset:0;z-index:50;display:none}
.sheet.on{display:block}
.sheet .bg{position:absolute;inset:0;background:rgba(30,15,30,.42);animation:fade .2s}
.sheet .pn{position:absolute;left:0;right:0;bottom:0;max-height:90vh;overflow:auto;background:var(--card);border-radius:30px 30px 0 0;padding:10px 20px calc(24px + env(safe-area-inset-bottom));animation:up .28s cubic-bezier(.2,.9,.3,1);max-width:640px;margin:0 auto}
.sheet .grab{width:42px;height:5px;border-radius:9px;background:var(--line);margin:4px auto 14px}
.sheet h3{font-size:21px;font-weight:800;margin-bottom:14px;display:flex;align-items:center;gap:8px;letter-spacing:-.3px}
.fld{margin-bottom:12px}.fld label{display:block;font-size:12px;font-weight:800;color:var(--muted);margin:0 0 6px 6px}
@keyframes up{from{transform:translateY(100%)}to{transform:none}}@keyframes fade{from{opacity:0}}
.ipick{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;max-height:190px;overflow:auto;padding:2px}
.ipick button{aspect-ratio:1;border-radius:14px;background:var(--soft);display:grid;place-items:center;color:var(--ink)}
.ipick button.on{background:var(--acc);color:#fff}
.cpick{display:flex;gap:8px;flex-wrap:wrap}.cpick button{width:34px;height:34px;border-radius:50%;border:3px solid transparent}.cpick button.on{border-color:var(--ink)}
.qadd{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.qadd button{display:flex;flex-direction:column;align-items:center;gap:7px;font-size:12px;font-weight:700}
.qadd button span{width:56px;height:56px;border-radius:20px;display:grid;place-items:center}
/* mondes immersifs */
.world{position:fixed;inset:0;z-index:60;display:none;flex-direction:column;color:#fff;background:#0B0A18;overflow:hidden}
.world.on{display:flex}
.wbg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;image-rendering:auto}
.wbg.pix{image-rendering:pixelated}
.wshade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(8,6,20,.15) 0%,rgba(8,6,20,.35) 45%,rgba(8,6,20,.82) 100%)}
.douceur{background:linear-gradient(-45deg,#F6B8D1,#C9B8F5,#A8C8F5,#F7D3B8);background-size:400% 400%;animation:dz 16s ease infinite}
@keyframes dz{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}
.wfg{position:relative;z-index:2;display:flex;flex-direction:column;height:100%;padding:calc(14px + env(safe-area-inset-top)) 20px calc(20px + env(safe-area-inset-bottom))}
.glass{background:rgba(255,255,255,.12);backdrop-filter:blur(18px) saturate(140%);-webkit-backdrop-filter:blur(18px) saturate(140%);border:1px solid rgba(255,255,255,.22);border-radius:28px}
.wfg .pd{display:flex;gap:6px;justify-content:center;margin:10px 0 14px}.wfg .pd i{height:4px;flex:1;max-width:44px;border-radius:9px;background:rgba(255,255,255,.3)}.wfg .pd i.on{background:#fff}
.wfg .st{flex:1;overflow:auto;padding:20px;margin-top:auto}
.wfg h4{font-family:var(--serif);font-weight:600;font-size:30px;line-height:1.1;margin-bottom:8px}
.wfg .lead{font-weight:600;opacity:.88;margin-bottom:16px;line-height:1.45;font-size:15px}
.wfg .pr{font-family:var(--serif);font-size:21px;line-height:1.55;font-weight:500;white-space:pre-line}
.wfg textarea,.wfg input{background:rgba(255,255,255,.16);color:#fff;border:0}
.wfg textarea::placeholder,.wfg input::placeholder{color:rgba(255,255,255,.7)}
.wfg .nav{display:flex;gap:10px;margin-top:14px}
.wfg .nav .btn{flex:1;background:#fff;color:#2A2230}.wfg .nav .btn.alt{background:rgba(255,255,255,.2);color:#fff;flex:0 0 auto}
.wbtn{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;color:#fff}
.breath{width:170px;height:170px;border-radius:50%;background:rgba(255,255,255,.2);border:1px solid rgba(255,255,255,.35);margin:10px auto 18px;display:grid;place-items:center;font-weight:800;font-size:18px;animation:br 8s ease-in-out infinite}
@keyframes br{0%,100%{transform:scale(.7)}50%{transform:scale(1.08)}}
.wcard{width:150px;border-radius:22px;overflow:hidden;position:relative;height:190px;color:#fff;text-align:left;box-shadow:var(--shadow2)}
.wcard img,.wcard .douceur{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.wcard .wl{position:absolute;left:0;right:0;bottom:0;padding:12px;background:linear-gradient(180deg,transparent,rgba(0,0,0,.65));font-weight:800;font-size:14px}
.wcard .wl small{display:block;font-weight:600;font-size:11px;opacity:.85}
.wcard.on{outline:3px solid var(--acc);outline-offset:2px}
.wcard .ok{position:absolute;top:10px;right:10px;width:26px;height:26px;border-radius:50%;background:var(--acc);display:grid;place-items:center}
.phero{border-radius:30px;overflow:hidden;position:relative;height:330px;margin-bottom:16px;color:#fff;box-shadow:var(--shadow)}
.phero .wfg{padding:18px;justify-content:flex-end}
.pbtn{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:22px;width:100%;text-align:left;color:#fff;margin-top:10px}
.pbtn .pi{width:44px;height:44px;border-radius:16px;background:rgba(255,255,255,.22);display:grid;place-items:center}
.prcard{width:210px;min-height:170px;border-radius:24px;padding:16px;text-align:left;display:flex;flex-direction:column;gap:8px;color:#2A2230}
.prcard .ex{font-family:var(--serif);font-size:15px;line-height:1.45;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden;opacity:.85}
.prcard.add{border:2px dashed color-mix(in srgb,var(--acc) 45%,transparent);background:transparent;color:var(--acc);align-items:center;justify-content:center;font-weight:800}
.mcard{width:170px;border-radius:24px;padding:16px;text-align:left;display:flex;flex-direction:column;gap:10px;background:var(--card);box-shadow:var(--shadow2)}
.mcard .mi{width:46px;height:46px;border-radius:16px;display:grid;place-items:center}
.pcp{width:250px;border-radius:24px;padding:16px;background:var(--card);box-shadow:var(--shadow2)}
/* notes / journal */
.notes{column-count:2;column-gap:12px}
.note{break-inside:avoid;display:block;width:100%;text-align:left;border-radius:22px;padding:14px;margin-bottom:12px;color:#2A2230}
.note .nd{font-size:11px;font-weight:800;opacity:.6;margin-bottom:6px;display:flex;align-items:center;gap:5px}
.note .nt{font-family:var(--serif);font-size:16px;line-height:1.4;font-weight:600;white-space:pre-line}
.note.add{border:2px dashed color-mix(in srgb,var(--acc) 45%,transparent);color:var(--acc);font-weight:800;display:flex;flex-direction:column;align-items:center;gap:6px;padding:26px 10px;background:transparent}
/* éditeur */
.editor{position:fixed;inset:0;z-index:70;display:none;flex-direction:column;background:linear-gradient(170deg,#BFD0F5 0%,#E7C6F0 45%,#F8D7E4 100%);padding:calc(12px + env(safe-area-inset-top)) 20px calc(20px + env(safe-area-inset-bottom));color:#2A2230}
.editor.on{display:flex}
@media (prefers-color-scheme:dark){.editor{background:linear-gradient(170deg,#25294A 0%,#3B2A4A 50%,#4A2A3A 100%);color:#F5EEF6}}
.editor .ebtn{width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,.55);display:grid;place-items:center;color:inherit;backdrop-filter:blur(10px)}
.editor .etitle{font-family:var(--serif);font-size:34px;font-weight:600;line-height:1.1;background:transparent;border:0;padding:0;margin-top:18px;color:inherit}
.editor .etitle::placeholder{color:currentColor;opacity:.4}
.editor .edate{font-size:13px;font-weight:700;opacity:.6;margin:8px 0 14px}
.editor .echips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.editor .echips button{padding:8px 14px;border-radius:999px;background:rgba(255,255,255,.5);font-weight:700;font-size:14px;color:inherit;display:inline-flex;gap:6px;align-items:center}
.editor .echips button.on{background:#fff;color:var(--acc);box-shadow:var(--shadow2)}
@media (prefers-color-scheme:dark){.editor .echips button{background:rgba(255,255,255,.12)}.editor .echips button.on{background:#fff}.editor .ebtn{background:rgba(255,255,255,.15)}}
.editor .epaper{flex:1;background:rgba(255,255,255,.78);border-radius:28px;padding:18px;display:flex;flex-direction:column;box-shadow:0 10px 30px rgba(80,60,120,.12)}
@media (prefers-color-scheme:dark){.editor .epaper{background:rgba(30,24,40,.7)}}
.editor textarea{flex:1;background:transparent;border:0;padding:0;font-size:18px;line-height:1.6;resize:none;color:inherit;min-height:0}
.editor .ehint{font-size:13px;opacity:.6;font-weight:600;margin-bottom:10px}
.editor .esave{align-self:center;margin-top:14px;padding:14px 28px;border-radius:999px;background:#fff;color:var(--ink);font-weight:800;display:flex;gap:8px;align-items:center;box-shadow:0 0 0 6px rgba(255,255,255,.35)}
/* soins */
.skhero{border-radius:28px;padding:18px;background:linear-gradient(135deg,#DCEAE3,#F3E6D8);color:#2E2724;display:flex;gap:14px;align-items:center;position:relative;overflow:hidden;margin-bottom:14px}
.skhero .ball{width:92px;height:92px;border-radius:50%;flex:none;background:radial-gradient(circle at 35% 30%,#fff 0,#F4E1D6 25%,#E3A98A 80%);display:grid;place-items:center;color:#A8502C;box-shadow:inset -6px -8px 18px rgba(168,80,44,.22),0 10px 20px rgba(168,80,44,.18)}
.step{display:flex;align-items:center;gap:12px;padding:10px 0}
.step .num{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:800;flex:none}
.thumb{width:56px;height:56px;border-radius:16px;background:var(--soft);display:grid;place-items:center;overflow:hidden;flex:none;border:1px solid var(--line);color:var(--muted)}
.thumb img{width:100%;height:100%;object-fit:cover}
.prod{width:150px;border-radius:22px;background:var(--card);box-shadow:var(--shadow2);overflow:hidden;text-align:left}
.prod .pimg{height:130px;background:var(--pink);display:grid;place-items:center;color:var(--acc)}
.prod .pimg img{width:100%;height:100%;object-fit:cover}
.prod .pt{padding:10px 12px 12px}
.photo-in{width:100%;height:170px;border-radius:22px;background:var(--soft);display:grid;place-items:center;overflow:hidden;color:var(--muted);border:2px dashed var(--line);font-weight:700;cursor:pointer}
.photo-in img{width:100%;height:100%;object-fit:cover}
.faces{display:flex;justify-content:space-between;gap:6px}
.faces button{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 4px;border-radius:20px;background:var(--soft);font-size:12px;font-weight:700;color:var(--muted)}
.faces button.on{background:var(--acc);color:#fff}
.streakc{border-radius:24px;padding:16px;background:var(--pink);display:flex;align-items:center;gap:14px}
.streakc .big{font-size:40px;font-weight:800;color:var(--acc);line-height:1}
/* divers */
.science{border-left:4px solid var(--teal);padding:2px 0 2px 12px;margin:10px 0}
.tl{font-size:13px;line-height:1.55}
.timer{font-size:64px;font-weight:800;text-align:center;letter-spacing:-1px}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chips button{background:var(--soft);border-radius:99px;padding:8px 13px;font-weight:700;font-size:14px;display:inline-flex;align-items:center;gap:4px}
.chips button.on{background:var(--acc);color:#fff}
#toast{position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top));transform:translateX(-50%) translateY(-140px);background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:99px;font-weight:700;font-size:14px;z-index:99;transition:transform .3s;max-width:92vw;text-align:center;display:flex;align-items:center;gap:8px}
#toast.on{transform:translateX(-50%) translateY(0)}
#fx{position:fixed;inset:0;pointer-events:none;z-index:95}
.xpfloat{position:fixed;z-index:96;pointer-events:none;font-weight:800;font-size:18px;color:var(--acc);animation:xpf 1s ease-out forwards}
@keyframes xpf{from{opacity:1;transform:translateY(0)}to{opacity:0;transform:translateY(-60px)}}
.lvlup{position:fixed;inset:0;z-index:90;display:none;align-items:center;justify-content:center;background:rgba(30,15,30,.6);padding:24px}
.lvlup.on{display:flex}
.lvlup .box{background:var(--card);border-radius:30px;padding:28px 22px;text-align:center;max-width:340px;width:100%;animation:zoom .4s cubic-bezier(.2,1.6,.4,1)}
.lvlup .crown{width:96px;height:96px;margin:0 auto 10px;border-radius:50%;display:grid;place-items:center;color:#fff;background:linear-gradient(135deg,#F7CF64,var(--acc));box-shadow:0 10px 30px color-mix(in srgb,var(--acc) 45%,transparent)}
.lvlup h2{font-size:32px;font-weight:800}
@keyframes zoom{from{transform:scale(.5);opacity:0}to{transform:none;opacity:1}}
.empty{text-align:center;color:var(--muted);padding:18px 8px;font-weight:700;font-size:14px}
.hm{display:grid;grid-template-rows:repeat(7,1fr);grid-auto-flow:column;gap:3px}
.hm i{width:100%;aspect-ratio:1;border-radius:4px;background:var(--soft)}
details summary{list-style:none;cursor:pointer}details summary::-webkit-details-marker{display:none}
.mitem{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.mitem input{padding:10px 14px}
.bdg{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.bdg div{text-align:center;padding:12px 6px;border-radius:20px;background:var(--soft);font-size:12px;font-weight:700;line-height:1.2}
.bdg div .bi{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;margin:0 auto 6px;background:var(--line);color:var(--muted)}
.bdg div.on .bi{background:linear-gradient(135deg,#F7CF64,var(--acc));color:#fff}
.bdg div:not(.on){opacity:.55}
.shopi{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}.shopi:last-child{border-bottom:0}
.sw{width:40px;height:40px;border-radius:14px;flex:none}
.scene{position:absolute;left:0;top:0;transform-origin:0 0;will-change:transform}
.scene img{display:block;user-select:none;-webkit-user-select:none;pointer-events:none}
.me{position:absolute;left:0;top:0;width:60px;height:110px;transform-origin:50% 100%;pointer-events:none;filter:drop-shadow(0 4px 8px rgba(0,0,0,.25))}
.me svg{transition:transform .15s}
.me.walk svg{animation:bob .42s ease-in-out infinite}
.me.walk .legs rect:first-child{animation:leg .42s ease-in-out infinite}.me.walk .legs rect:last-child{animation:leg .42s ease-in-out infinite reverse}
@keyframes bob{0%,100%{translate:0 0}50%{translate:0 -4px}}
@keyframes leg{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
.tapdot{position:absolute;width:34px;height:12px;margin:-6px 0 0 -17px;border-radius:50%;border:2px solid rgba(255,255,255,.9);opacity:0;pointer-events:none}
.tapdot.on{animation:tapd .9s ease-out}
@keyframes tapd{0%{opacity:1;transform:scale(.3)}100%{opacity:0;transform:scale(1.6)}}
.motes{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:3}
.xui{position:absolute;left:0;right:0;z-index:4;padding:0 16px;display:flex;gap:10px}
.xui.top{top:calc(12px + env(safe-area-inset-top));align-items:center}
.xui.bot{bottom:calc(16px + env(safe-area-inset-bottom));flex-direction:column}

const cnt=(h,d)=>(S.logs[d]||{})[h.id]||0;
const tgt=h=>h.type==='count'?h.target:1;

const weekCount=(h,d)=>{const m=monday(d);let n=0;for(let i=0;i<7;i++)if(cnt(h,addDays(m,i))>0)n++;return n};
function lastDone(h){const ks=Object.keys(S.logs).filter(k=>S.logs[k][h.id]>0).sort();return ks.length?ks[ks.length-1]:null}
function doneDates(h){return Object.keys(S.logs).filter(k=>S.logs[k][h.id]>0).sort()}
function dueIn(h){const l=lastDone(h);if(!l)return h.firstDue?diff(today(),h.firstDue):0;return h.every-diff(l,today())}
function streak(h){
  const t=today();
  if(h.type==='weekly'){let m=monday(t),s=0;if(weekCount(h,m)<h.target)m=addDays(m,-7);for(let i=0;i<260;i++){if(weekCount(h,m)>=h.target){s++;m=addDays(m,-7)}else break}return s}
  if(h.type==='interval'){const ds=doneDates(h);if(!ds.length)return 0;if(diff(ds[ds.length-1],t)>h.every+1)return 0;let s=1;for(let i=ds.length-1;i>0;i--){if(diff(ds[i-1],ds[i])<=h.every+1)s++;else break}return s}
  let d=isDone(h,t)?t:addDays(t,-1),s=0,miss=0;
  for(let i=0;i<4000;i++){if(isDone(h,d)){s++;miss=0}else if(!S.frozen[d]){miss++;if(miss>=2)break}d=addDays(d,-1);if(d<'2020-01-01')break}
  return s;
}
const atRisk=h=>(h.type==='daily'||h.type==='count')&&!isDone(h,today())&&!isDone(h,addDays(today(),-1))&&!S.frozen[addDays(today(),-1)]&&streak(h)>0;
function bump(h,delta){
  const t=today();S.logs[t]=S.logs[t]||{};const before=isDone(h,t);
  let v=(S.logs[t][h.id]||0)+delta;const max=h.type==='count'?h.target:1;v=Math.max(0,Math.min(max,v));
  S.logs[t][h.id]=v;if(!v)delete S.logs[t][h.id];
  const after=isDone(h,t);const st=streak(h);if(st>(h.best||0))h.best=st;save();
  if(delta>0){const kk='h|'+h.id+'|'+t;earn(kk+'|'+v,5,0,true);if(after&&!before)earn(kk+'|fin',10,1);buzz([20,40,30]);

    else{ding(660);toast(h.name+' '+v+' / '+max,'check')}}
  else if(delta<0){const kk='h|'+h.id+'|'+t;for(let i=v+1;i<=max;i++)unearn(kk+'|'+i);if(!after)unearnPrefix(kk+'|')}
  return after&&!before;
}

  return st?fl+st:(isDone(h,today())?I('check',13):'');
}
function ring(h){
  const c0=col(h);const c=cnt(h,today());const R=46,C=2*Math.PI*R;let segs='';
  let n=1,filled=isDone(h,today())?1:0;
  if(h.type==='count'){n=h.target;filled=c}
  if(h.type==='weekly'){n=h.target;filled=Math.min(h.target,weekCount(h,today()))}
  if(h.type==='interval'&&!isDone(h,today())){const d=dueIn(h);const frac=Math.max(0,Math.min(1,1-d/h.every));segs=`<circle cx="50" cy="50" r="${R}" fill="none" stroke="${c0}" stroke-opacity=".18" stroke-width="7"/><circle cx="50" cy="50" r="${R}" fill="none" stroke="${c0}" stroke-width="7" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C*(1-frac)}" transform="rotate(-90 50 50)" opacity="${d<=0?1:.55}"/>`;n=0}
  if(n===1)segs=`<circle cx="50" cy="50" r="${R}" fill="none" stroke="${c0}" stroke-opacity="${filled?1:.2}" stroke-width="7"/>`;
  else if(n>1){const gap=n>12?1:3;const sg=360/n;for(let i=0;i<n;i++){const a0=(i*sg+gap/2-90)*Math.PI/180,a1=((i+1)*sg-gap/2-90)*Math.PI/180;segs+=`<path d="M${(50+R*Math.cos(a0)).toFixed(2)} ${(50+R*Math.sin(a0)).toFixed(2)} A${R} ${R} 0 0 1 ${(50+R*Math.cos(a1)).toFixed(2)} ${(50+R*Math.sin(a1)).toFixed(2)}" fill="none" stroke="${c0}" stroke-opacity="${i<filled?1:.2}" stroke-width="7"/>`}}
  const fill=isDone(h,today())?`<circle cx="50" cy="50" r="40" fill="${c0}"/>`:'';
  return `<svg class="ring" viewBox="0 0 100 100">${fill}${segs}<circle class="hold" cx="50" cy="50" r="${R}" fill="none" stroke="${c0}" stroke-width="9" stroke-linecap="round" stroke-dasharray="289" transform="rotate(-90 50 50)"/></svg>`;
}

function mountScene(box,k,o={}){
  const m=MEDIA[k];
  const cv=document.createElement('canvas');cv.className='motes';
  if(!m||(m.t!=='img'&&!m.walk)){box.insertAdjacentHTML('afterbegin',mediaBG(k));box.appendChild(cv);const vd=box.querySelector('video');if(vd){vd.muted=true;vd.play().catch(()=>{})}return startMotes(box,cv,k,()=>{})}

  box.appendChild(cv);
  const scene=box.querySelector('.scene'),img=scene.querySelector('img,video'),me=null,td=null;
  const st={mode:o.fit?'fit':'imm',sw:0,sh:0,cx:0,cy:0,ax:0,ay:0,tx:null,ty:null,follow:true,gx:0,gy:0,raf:0,last:0,face:1,alive:true};
  const bw=()=>box.clientWidth,bh=()=>box.clientHeight;
  function layout(){const nw=img.naturalWidth||img.videoWidth,nh=img.naturalHeight||img.videoHeight;const r=nw/nh||.66;let sh,sw;if(st.mode==='fit'){sh=bh()*(o.fit||1);sw=sh*r;if(sw<bw()){sw=bw();sh=sw/r}}else if(st.mode==='all'){sw=bw();sh=sw/r;if(sh>bh()){sh=bh();sw=sh*r}}else{sh=Math.max(bh()*1.35,innerHeight*.9);sw=sh*r;if(sw<bw()*1.4){sw=bw()*1.4;sh=sw/r}}const k0=st.sw?sw/st.sw:1;st.ax*=k0;st.ay*=k0;st.cx*=k0;st.cy*=k0;st.sw=sw;st.sh=sh;img.style.width=sw+'px';img.style.height=sh+'px';scene.style.width=sw+'px';scene.style.height=sh+'px';if(!st.ax){st.ax=sw/2;st.ay=sh*(o.sy||.86);st.cx=st.ax-bw()/2;st.cy=st.ay-bh()*.66}}
  const clamp=()=>{st.cx=Math.max(0,Math.min(st.sw-bw(),st.cx));st.cy=Math.max(0,Math.min(st.sh-bh(),st.cy))};

    if(st.tx!==null){const dx=st.tx-st.ax,dy=st.ty-st.ay,d=Math.hypot(dx,dy),sp=Math.max(260,d*2.2)*dt;if(d<=sp){st.ax=st.tx;st.ay=st.ty;st.tx=null}else{st.ax+=dx/d*sp;st.ay+=dy/d*sp;walking=true;if(Math.abs(dx)>2)st.face=dx>0?1:-1}}
    if(st.follow){const wx=st.ax-bw()/2,wy=st.ay-bh()*.5;st.cx+=(wx-st.cx)*Math.min(1,dt*3);st.cy+=(wy-st.cy)*Math.min(1,dt*3)}

    st.raf=requestAnimationFrame(frame)}
  const run=()=>{layout();st.raf=requestAnimationFrame(frame)};if(img.tagName==='VIDEO'){img.muted=true;img.play().catch(()=>{});if(img.readyState>=1)run();else img.addEventListener('loadedmetadata',run,{once:true})}else if(img.complete&&img.naturalWidth)run();else img.onload=run;
  let down=null;

function startMotes(box,cv,k,onStop){const cx=cv.getContext('2d');const col=(WORLDS[k]&&WORLDS[k].mote)||'#FFFFFF';const P=[];let alive=true;

function tone(f,t0,dur,type='triangle',vol=.16,slide=0){if(S.sound===false)return;try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();const now=AC.currentTime+t0;const o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.setValueAtTime(f,now);if(slide)o.frequency.exponentialRampToValueAtTime(f*slide,now+dur);g.gain.setValueAtTime(.0001,now);g.gain.exponentialRampToValueAtTime(vol,now+.012);g.gain.exponentialRampToValueAtTime(.0001,now+dur);o.connect(g).connect(AC.destination);o.start(now);o.stop(now+dur+.02)}catch(e){}}
function sfx(n){const st=Math.pow(2,Math.min(SND.combo,12)/12);
  ({tap:()=>tone(660,0,.06,'sine',.08),
    pop:()=>{tone(520*st,0,.09,'triangle',.14,1.6)},
    done:()=>{tone(784*st,0,.09,'square',.07);tone(1175*st,.07,.16,'triangle',.14)},
    coin:()=>{tone(988,0,.07,'square',.07);tone(1319,.06,.22,'square',.07)},
    combo:()=>{[0,4,7,12].forEach((s,i)=>tone(660*st*Math.pow(2,s/12),i*.05,.12,'triangle',.11))},
    level:()=>{[523,659,784,1047,1319].forEach((f,i)=>tone(f,i*.09,.22,'triangle',.14));tone(1568,.48,.45,'sine',.12)},
    chest:()=>{[392,523,659,784,1047,1319,1568].forEach((f,i)=>tone(f,i*.06,.18,'square',.06));tone(2093,.5,.6,'sine',.1)},
    surprise:()=>{[1047,1319,1568,2093].forEach((f,i)=>tone(f,i*.07,.2,'sine',.12))},
    undo:()=>tone(392,0,.14,'sine',.1,.7),
    whoosh:()=>tone(300,0,.25,'sawtooth',.03,3)})[n]?.()}

    const weeks=[];for(let i=7;i>=0;i--){const m=addDays(monday(t),-7*i);const e=addDays(m,6);weeks.push({label:fshort(m),value:S.spend.filter(s=>s.date>=m&&s.date<=e).reduce((a,s)=>a+s.amount,0)})}
    const avg=weeks.slice(0,7).reduce((a,w)=>a+w.value,0)/7;
    h+=`<div class="row" style="gap:10px;margin-bottom:12px"><div class="card grow" style="margin:0"><div class="small muted b">Ce mois-ci</div><div class="b" style="font-size:26px">${tot.toFixed(2)} €</div></div><div class="card grow" style="margin:0"><div class="small muted b">Moyenne / semaine</div><div class="b" style="font-size:26px">${avg.toFixed(0)} €</div></div></div>
    <div class="card"><div class="b row" style="margin-bottom:8px"><span style="color:var(--acc)">${I('chart-column')}</span>Courses par semaine</div>${bars(weeks,COLORS.sage)}</div>
    <div class="card"><div class="row"><input id="da" type="number" step="0.01" inputmode="decimal" placeholder="Montant €" class="grow"><input id="ds" placeholder="Magasin" class="grow"></div><div class="row" style="margin-top:8px"><input id="dd" type="date" value="${t}" class="grow"><button class="btn" id="daOk">${I('plus')} Ajouter</button></div></div>
    <div class="card">${S.spend.slice(-25).reverse().map(s=>`<div class="item"><div class="ico">${I('receipt')}</div><span class="t grow">${esc(s.store||'Courses')}<br><span class="small muted">${fdate(s.date)}</span></span><span class="b">${s.amount.toFixed(2)} €</span><button class="del" data-ddel="${s.id}">${I('x',18)}</button></div>`).join('')||'<div class="empty">Aucune dépense enregistrée</div>'}</div>`;
    v.innerHTML=h;
    $('#daOk').onclick=()=>{const a=parseFloat(String($('#da').value).replace(',','.'));if(!(a>0))return toast('Montant ?','euro');S.spend.push({id:uid(),date:$('#dd').value||t,amount:a,store:$('#ds').value.trim()});save();render()};
    v.querySelectorAll('[data-ddel]').forEach(b=>b.onclick=()=>{S.spend=S.spend.filter(x=>x.id!==b.dataset.ddel);save();render()});
  }
}
function bars(data,c){const mx=Math.max(1,...data.map(d=>d.value));const W=320,Hh=150,bw=W/data.length;
  return `<svg viewBox="0 0 ${W} ${Hh+34}" style="width:100%">${data.map((d,i)=>{const h=d.value/mx*Hh;return `<rect x="${i*bw+bw*.18}" y="${Hh-h+14}" width="${bw*.64}" height="${Math.max(h,2)}" rx="6" fill="${c}" opacity="${i===data.length-1?1:.6}"/>${d.value?`<text x="${i*bw+bw/2}" y="${Hh-h+9}" text-anchor="middle" font-size="10" font-weight="800" fill="currentColor">${Math.round(d.value)}</text>`:''}<text x="${i*bw+bw/2}" y="${Hh+30}" text-anchor="middle" font-size="9.5" fill="#8C817A">${esc(d.label)}</text>`}).join('')}</svg>`}

/* ============ PROFIL & STATS ============ */
function vStats(v){
  const t=today();
  const daily=S.habits.filter(h=>h.type==='daily'||h.type==='count');
  let hm='<div class="hm">';const start=addDays(monday(t),-7*15);for(let i=0;i<16*7;i++){const d=addDays(start,i);if(d>t){hm+='<i style="opacity:0"></i>';continue}const r=daily.length?daily.filter(h=>isDone(h,d)).length/daily.length:0;hm+=`<i style="background:${r?'var(--acc)':'var(--soft)'};opacity:${r?Math.max(.2,r):1}"></i>`}hm+='</div>';
  const chores=S.habits.filter(h=>h.sec==='maison').map(h=>{let n=0;for(let i=0;i<30;i++)if(cnt(h,addDays(t,-i))>0)n++;return{label:h.name.split(' ')[0].slice(0,6),value:n}});
  const foc=[],pr=[];for(let i=6;i>=0;i--){const d=addDays(t,-i);foc.push({label:JOURS[parse(d).getDay()],value:S.focusLog[d]||0});const p=S.prayLog[d]||{};pr.push({label:JOURS[parse(d).getDay()],value:(p.m?1:0)+(p.s?1:0)})}
  const l=level();const cur=60*(l-1)**2,nxt=60*l**2;
  const ranked=S.habits.slice().sort((a,b)=>streak(b)-streak(a));
  const nb=BADGES.filter(b=>S.badges[b[0]]).length;
  v.innerHTML=`
  <div class="hero"><span class="deco">${I('crown',130,1.5)}</span><h2>Niveau ${l} · ${lvlName(l)}</h2><p>${S.xp} XP — encore ${nxt-S.xp} XP avant le niveau ${l+1}</p><div class="bar"><i style="width:${(S.xp-cur)/(nxt-cur)*100}%"></i></div>
  <div class="stats3"><div>${combo()}<small>combo jours</small></div><div>${S.gems}<small>gemmes</small></div><div>${nb}/${BADGES.length}<small>badges</small></div></div></div>
  <div class="h2">${I('award')} Badges</div><div class="card"><div class="bdg">${BADGES.map(b=>`<div class="${S.badges[b[0]]?'on':''}"><span class="bi">${I(S.badges[b[0]]?b[1]:'lock',24)}</span>${b[2]}</div>`).join('')}</div></div>
  <div class="h2">${I('calendar-days')} 16 dernières semaines</div><div class="card">${hm}</div>
  <div class="h2">${I('flame')} Séries</div><div class="card">${ranked.map(h=>`<div class="item"><div class="ico" style="color:${col(h)}">${I(h.icon)}</div><span class="t grow">${esc(h.name)}</span><span class="b row" style="gap:3px">${I('flame',15)} ${streak(h)}</span><span class="small muted b row" style="gap:3px;width:52px;justify-content:flex-end">${I('trophy',13)} ${Math.max(h.best||0,streak(h))}</span></div>`).join('')}</div>
  <div class="h2">${I('house')} Ménage — 30 jours</div><div class="card">${bars(chores,COLORS.lav)}</div>
  <div class="h2">${I('timer')} Minutes de focus — 7 jours</div><div class="card">${bars(foc,COLORS.teal)}</div>
  <div class="h2">${I('hand-heart')} Prières — 7 jours</div><div class="card">${bars(pr,COLORS.gold)}<p class="small muted">2 = matin + soir.</p></div>
  <div class="card"><div class="b row" style="margin-bottom:6px"><span style="color:var(--teal)">${I('lightbulb')}</span>Pourquoi les séries ?</div><div class="science tl">Il faut en moyenne ~66 jours pour qu’un comportement devienne automatique (de 18 à 254 selon les personnes), et rater un jour isolé ne compromet pas la formation de l’habitude (Lally et al., 2010). D’où la règle : <b>ta série survit à un jour raté, pas à deux</b>.</div></div>`;
}

/* ============ RÉGLAGES ============ */
function vSet(v){
  v.innerHTML=`
  <div class="card"><div class="fld"><label>Ton prénom</label><input id="nmI" value="${esc(S.name)}"></div><div class="row" style="margin-top:6px"><span class="grow b">Sons de jeu</span><button class="btn sm ${S.sound===false?'alt':''}" id="sndT">${S.sound===false?'Désactivés':'Activés'}</button></div><button class="btn alt full" id="qfT" style="margin-top:10px">Police de la pensée du jour</button></div>
  <div class="h2">${I('repeat')} Mes habitudes<small><button class="btn sm" id="addH">${I('plus',16)} Ajouter</button></small></div>
  <div class="card">${Object.keys(SECTIONS).map(k=>S.habits.filter(h=>h.sec===k).map(h=>`<button class="item" style="width:100%;text-align:left" data-eh="${h.id}"><div class="ico" style="color:${col(h)}">${I(h.icon)}</div><span class="grow"><span class="t">${esc(h.name)}</span><br><span class="small muted">${{daily:'Chaque jour',count:h.target+'× / jour',weekly:h.target+'× / semaine',interval:'Tous les '+h.every+' j'}[h.type]} · ${SECTIONS[h.sec][0]}</span></span>${I('pencil',16)}</button>`).join('')).join('')}</div>
  <div class="h2">${I('smartphone')} Installer sur l’iPhone</div>
  <div class="card tl"><p>1. Ouvre <b>oliviadlm.github.io/Organisation-/</b> dans <b>Safari</b>.<br>2. Partager → <b>« Sur l’écran d’accueil »</b>.<br>3. Attention : l’app de l’écran d’accueil a sa propre mémoire. Copie ta progression avant, et colle-la après.</p><p class="muted" style="margin-top:8px">Les données sont stockées dans ce navigateur : exporte une sauvegarde de temps en temps.</p></div>
  <div class="h2">${I('download')} Sauvegarde</div>
  <div class="card"><p class="small muted b" style="margin-bottom:10px">Avant de supprimer ou réinstaller l’app, copie ta progression puis colle-la dans la nouvelle.</p><div class="row wrap" style="margin-bottom:10px"><button class="btn" id="cpy">${I('copy',18)} Copier ma progression</button><button class="btn alt" id="pst">${I('clipboard-paste',18)} Coller une progression</button></div><div class="row wrap"><button class="btn alt" id="exp">${I('download',18)} Exporter</button><label class="btn alt" style="cursor:pointer">${I('upload',18)} Importer<input type="file" id="imp" accept=".json,application/json" style="display:none"></label><button class="btn alt" id="rst" style="color:var(--red)">Réinitialiser</button></div></div>
  <p class="small muted" style="text-align:center;margin:10px 0 20px">Ma Journée · faite pour Olivia</p>`;
  $('#sndT').onclick=()=>{S.sound=S.sound===false;save();render();sfx('coin')};$('#qfT').onclick=fontPicker;$('#nmI').onchange=e=>{S.name=e.target.value.trim()||'Olivia';save()};
  $('#addH').onclick=()=>habitForm();
  v.querySelectorAll('[data-eh]').forEach(b=>b.onclick=()=>habitForm(S.habits.find(h=>h.id===b.dataset.eh)));
  $('#exp').onclick=()=>{const txt=JSON.stringify(S);const done=()=>toast('Sauvegarde copiée — colle-la dans tes Notes','check');try{navigator.clipboard.writeText(txt).then(done,()=>showBk(txt))}catch(e){showBk(txt)}};
  const cpyF=()=>{const txt=JSON.stringify(S);const ok=()=>{toast('Progression copiée ! Colle-la dans tes Notes','check');sfx('coin')};try{navigator.clipboard.writeText(txt).then(ok,()=>showBk(txt))}catch(e){showBk(txt)}};$('#cpy').onclick=cpyF;
  $('#pst').onclick=()=>{openSheet(`<h3>Coller ma progression</h3><p class="small muted" style="margin-bottom:8px">Colle ici le texte copié depuis l’ancienne app. Ce qui est dans l’app maintenant sera remplacé.</p><textarea id="pstT" style="min-height:160px;font-size:12px" placeholder="{&quot;habits&quot;:…"></textarea><button class="btn full" id="pstOk" style="margin-top:10px">Restaurer</button>`);
    $('#pstOk').onclick=()=>{try{const o=JSON.parse($('#pstT').value.trim());if(!o.habits)throw 0;S=o;migrate();save();applyTheme();closeSheet();toast('Progression restaurée','check');sfx('level');render()}catch(x){toast('Texte invalide : recopie tout le texte','triangle-alert')}}};
  $('#imp').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const o=JSON.parse(r.result);if(!o.habits)throw 0;S=o;migrate();save();applyTheme();toast('Sauvegarde restaurée','check');render()}catch(x){toast('Fichier invalide','triangle-alert')}};r.readAsText(f)};
  $('#rst').onclick=()=>{ask('Tout effacer ? (exporte d’abord une sauvegarde)',()=>{S=defaults();save();applyTheme();go('home')},'Tout effacer')};
}

function showBk(txt){openSheet(`<h3>Ma sauvegarde</h3><p class="small muted" style="margin-bottom:8px">Sélectionne tout et copie ce texte dans tes Notes.</p><textarea style="min-height:200px;font-size:12px">${esc(txt)}</textarea>`)}
/* ============ DÉMARRAGE ============ */
QPOOL.push({id:'skin',ic:'sparkles',t:'Fais une routine skincare complète',ok:t=>routineDone(t,'m')||routineDone(t,'s')});
BADGES.push(['glow','sparkles','Glow : 7 jours de skincare',()=>skStreak()>=7]);
applyTheme();render();
let lastDay=today();
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&today()!==lastDay){lastDay=today();render()}});
setInterval(()=>{if(today()!==lastDay){lastDay=today();if(!FLOW)render()}},60000);
</script>
</body>
</html>
